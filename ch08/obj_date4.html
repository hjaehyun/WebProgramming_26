<body>
    <h2 id-'clock'><h2>
    <script>
        function setClock(){
            let now = new Date();
            let s = now.getFullYear() + ':' + (now.getMonth()+1) + ':' + now.getDate();
            document.getElementById('clock').innerHTML = s;
            setTimeout("setClock()", 1000);
        }
        setClock();
    </script>
</body>
