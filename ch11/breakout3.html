<body>
    <canvas id="myCanvas" width="600" height="400"></canvas>
    <script>
        let canvas = document.getElementById("myCanvas");
        let context = canvas.getContext("2d");
        let brickRows = 3;
        let brickColumns = 5;
        let brickWidth = 75;
        let brickHeight = 20;
        let brickPadding = 10;
        let brickStartX = 30;
        let brickStartY = 30;
        let bricks = new Array(brickRows);
        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
            draw() {
                context.beginPath();
                context.rect(this.x, this.y, brickWidth, brickHeight);
                context.fillStyle = "brown";
                context.fill();
                context.closePath();
            }
        }
        function init() {
            document.addEventListener("mousemove", mouseHandler, false);
            for (let r = 0; r < brickRows; r++) {
                bricks[r] = new Array(brickColumns);
                for (let c = 0; c < brickColumns; c++) {
                    let brickX = (c * (brickWidth + brickPadding)) + brickStartX;
                    let brickY = (r * (brickHeight + brickPadding)) + brickStartY;
                    bricks[r][c] = new Brick(brickX, brickY);
                }
            }
        }
        function gameLoop() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            ball.draw();
            paddle.draw();
            for (let r = 0; r < brickRows; r++) {
                for (let c = 0; c < brickColumns; c++) {
                    bricks[r][c].draw();
                }
            }
            if (ball.x + ball.dx > canvas.width - ball.radius
                || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            }
            else if (ball.y + ball.dy > canvas.height - ball.radius) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    ball.dy = -ball.dy;
                }
                else {
                    clearInterval(interval);
                }
            }
            ball.x += ball.dx;
            ball.y += ball.dy;
        }
        init();
        setInterval(gameLoop, 10);
    </script>
