<head>
    <style>
        .button{
            padding: 10px;
            width: 50px;
            height: 50px;
        }
    </style>
    <script>
        function add(){
            let num1,num2;
            num1 = parseFloat(document.getElementById("num1").value);
            num2 = parseFloat(document.getElementById("num2").value);
            document.getElementById("result").value=num1 + num2;
        }
    </script>
</head>
<body>
    숫자 1: <input type="text" id="num1" value="9"><br>
    숫자 2: <input type="text" id="num2" value="6"><br>
    <input type="button" value="+" onclick="add()" class="button">
    <input type="button" value="-" class="button">
    <input type="button" value="*" class="button">
    <input type="button" value="/" class="button"><br>
    연산결과: <input type="text" id="result" value="">
</body>
